<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Mapa Clientes</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
#map { height: 100vh; }

.popup { max-height: 250px; overflow-y: auto; }

.cliente {
  border-bottom: 1px solid #ccc;
  margin-bottom: 5px;
  padding-bottom: 5px;
}

.btn {
  display: inline-block;
  margin-top: 3px;
  padding: 4px 6px;
  background: #007bff;
  color: white;
  text-decoration: none;
  border-radius: 4px;
  font-size: 12px;
}
</style>
</head>

<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

// 📍 MAPA
var map = L.map('map').setView([29.7604, -95.3698], 10);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

// 🔗 CSV CON PROXY (evita bloqueos)
const sheetURL = "https://api.allorigins.win/raw?url=" + encodeURIComponent(https://docs.google.com/spreadsheets/d/e/2PACX-1vTPQ2YtrYxaLo0nxjbYyR1vA9y0tz1FSlDnr-hX0tdjDL3xU9iqmXAsz3tCHlUavM9eWnc6lt0U5UUh/pub?gid=0&single=true&output=csv);
// 📅 VALIDAR FECHA
function estaVencido(fecha) {
  if (!fecha) return false;

  fecha = fecha.replace(/"/g, "").trim();

  const partes = fecha.split("-");
  if (partes.length !== 3) return false;

  const fechaCliente = new Date(partes[0], partes[1]-1, partes[2]);

  const hoy = new Date();
  const hoyClean = new Date(hoy.getFullYear(), hoy.getMonth(), hoy.getDate());

  return hoyClean > fechaCliente;
}

// 🔄 CSV ROBUSTO
function csvToJSON(csv) {
  const lines = csv.trim().split("\n");
  const headers = lines[0].split(",");

  const result = [];

  for (let i = 1; i < lines.length; i++) {

    let row = [];
    let current = "";
    let insideQuotes = false;

    for (let char of lines[i]) {
      if (char === '"') insideQuotes = !insideQuotes;
      else if (char === ',' && !insideQuotes) {
        row.push(current);
        current = "";
      } else {
        current += char;
      }
    }

    row.push(current);

    if (row.length < headers.length) continue;

    let obj = {};
    headers.forEach((h, j) => {
      obj[h.trim()] = (row[j] || "").trim().replace(/"/g, "");
    });

    result.push(obj);
  }

  return result;
}

// 🚀 OPTIMIZAR RUTA
function optimizarRuta(clientes) {

  if (clientes.length < 2) {
    alert("Necesitas al menos 2 clientes");
    return;
  }

  clientes.sort((a,b) => parseFloat(a.Lat) - parseFloat(b.Lat));

  let base = clientes[0].Direccion;

  let waypoints = clientes.slice(1)
    .map(c => encodeURIComponent(c.Direccion))
    .join("/");

  let url = `https://www.google.com/maps/dir/${encodeURIComponent(base)}/${waypoints}`;

  window.open(url);
}

// 🚀 CARGAR DATOS
async function cargarDatos() {

  try {

    const res = await fetch(sheetURL);
    const csv = await res.text();

    if (!csv.includes("ZIP")) {
      throw new Error("CSV incorrecto");
    }

    const data = csvToJSON(csv);

    const grupos = {};

    data.forEach(c => {

      let lat = parseFloat((c.Lat || "").replace(/"/g, ""));
      let lng = parseFloat((c.Lng || "").replace(/"/g, ""));

      if (isNaN(lat) || isNaN(lng)) return;

      if (!grupos[c.ZIP]) grupos[c.ZIP] = [];
      grupos[c.ZIP].push(c);
    });

    for (const zip in grupos) {

      const clientes = grupos[zip];

      let lat = parseFloat(clientes[0].Lat);
      let lng = parseFloat(clientes[0].Lng);

      let html = `<div class="popup"><b>ZIP: ${zip}</b><br><br>`;

      clientes.forEach(c => {

        let vencido = estaVencido(c.Renovacion);
        let color = vencido ? "red" : "green";

        html += `
          <div class="cliente">
            <b>${c.Nombre}</b><br>
            📞 ${c.Telefono}<br>
            📧 ${c.Email}<br>
            📍 ${c.Direccion}<br>
            🗑️ ${c.HoraBasura}<br>
            💳 ${c.Membresia}<br>
            🔄 ${c.Renovacion}<br>

            <span style="color:${color}">
              ${vencido ? "🔴 VENCIDO" : "🟢 ACTIVO"}
            </span><br>

            <a class="btn" href="tel:${c.Telefono}">📞 Llamar</a>

            <a class="btn" target="_blank"
            href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(c.Direccion)}">
            📍 Ver en Maps
            </a>
          </div>
        `;
      });

      html += `
        <button onclick='optimizarRuta(${JSON.stringify(clientes)})'
        class="btn" style="background:green">
        🚀 Optimizar Ruta
        </button>
      </div>
      `;

      L.marker([lat, lng]).addTo(map).bindPopup(html);
    }

  } catch (error) {
    console.error(error);
    alert("❌ Error cargando datos");
  }
}

cargarDatos();

</script>

</body>
</html>
